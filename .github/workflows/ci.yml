name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: test-only-not-a-real-key
        # settings_test swaps in sqlite, so no database service is needed.
        run: python manage.py test --settings=backend.settings_test -v 2
